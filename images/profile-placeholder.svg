<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 720" width="720" height="720" role="img" aria-labelledby="avatarTitle">
  <title id="avatarTitle">Placeholder portrait for a student portfolio</title>

  <defs>
    <linearGradient id="bgGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f2f3ff"/>
      <stop offset="100%" stop-color="#dfe3fb"/>
    </linearGradient>
    <linearGradient id="figureGradient" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#7c6cf0"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
  </defs>

  <!-- Soft background with two decorative circles -->
  <rect width="720" height="720" fill="url(#bgGradient)"/>
  <circle cx="612" cy="104" r="170" fill="#ffffff" opacity="0.38"/>
  <circle cx="104" cy="640" r="190" fill="#ffffff" opacity="0.28"/>

  <!-- Abstract person: head, neck and shoulders -->
  <circle cx="360" cy="278" r="112" fill="url(#figureGradient)"/>
  <rect x="322" y="372" width="76" height="150" rx="30" fill="url(#figureGradient)"/>
  <path d="M148 720c0-118 95-188 212-188s212 70 212 188z" fill="url(#figureGradient)"/>
  <path d="M300 532h120a34 34 0 0 1 34 34v154H266V566a34 34 0 0 1 34-34z" fill="#ffffff" opacity="0.20"/>

  <!-- Clear label so nobody forgets this is a placeholder -->
  <g transform="translate(360 652)">
    <rect x="-150" y="-27" width="300" height="54" rx="27" fill="#ffffff" opacity="0.9"/>
    <text x="0" y="6" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="2" fill="#4338ca">PLACEHOLDER PHOTO</text>
  </g>
</svg>
